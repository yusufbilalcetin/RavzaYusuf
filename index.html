<!DOCTYPE html>
<html lang="tr" class="theme-liquid-glass launcher-experience">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="app-theme-color" content="#f5f4fb">
  <script>
    (() => {
      const root = document.documentElement;
      const modes = ["light", "dark", "system"];
      const styles = ["noel-ask", "gece-mavisi", "orman-yesili", "mor-isik", "klasik-koyu", "pembe-tema"];
      const read = (key) => {
        try { return localStorage.getItem(key); } catch (_) { return null; }
      };
      try {
        const storedMode = read("eul_theme");
        const storedStyle = read("eul_theme_style");
        const mode = modes.includes(storedMode) ? storedMode : "system";
        const legacyStyle = storedStyle === "gun-isigi" ? "pembe-tema" : storedStyle;
        const style = styles.includes(legacyStyle) ? legacyStyle : "noel-ask";
        const resolvedMode = mode === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : mode;
        const bootBackgrounds = {
          light: { "noel-ask": "#fff6f8", "pembe-tema": "#fff4f8" },
          dark: {
            "noel-ask": "#0f080b",
            "gece-mavisi": "#08111f",
            "orman-yesili": "#08120d",
            "mor-isik": "#0d0718",
            "klasik-koyu": "#0f1117",
            "pembe-tema": "#10070c"
          }
        };
        const background = bootBackgrounds[resolvedMode][style]
          || (resolvedMode === "dark" ? "#0f1117" : "#f5f4fb");
        const state = Object.freeze({ mode, resolvedMode, style });
        const apply = (element) => {
          if (!element) return false;
          element.dataset.themeMode = mode;
          element.dataset.resolvedTheme = resolvedMode;
          element.dataset.themeStyle = style;
          element.classList.toggle("dark", resolvedMode === "dark");
          element.classList.toggle("theme-dark", resolvedMode === "dark");
          element.classList.toggle("theme-light", resolvedMode === "light");
          element.style.colorScheme = resolvedMode;
          return true;
        };
        apply(root);
        root.style.backgroundColor = background;
        document.getElementById("app-theme-color")?.setAttribute("content", background);
        globalThis.__RAVZA_THEME_BOOT__ = state;
        if (!apply(document.body)) {
          const observer = new MutationObserver(() => {
            if (apply(document.body)) observer.disconnect();
          });
          observer.observe(root, { childList: true });
        }
      } catch (_) {
        root.dataset.themeMode = "system";
        root.dataset.resolvedTheme = "light";
        root.dataset.themeStyle = "noel-ask";
        root.classList.add("theme-light");
        root.style.colorScheme = "light";
        root.style.backgroundColor = "#f5f4fb";
        document.getElementById("app-theme-color")?.setAttribute("content", "#f5f4fb");
        globalThis.__RAVZA_THEME_BOOT__ = Object.freeze({ mode: "system", resolvedMode: "light", style: "noel-ask" });
      }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:,">
  <title>Ravza 💗 | EUL Study System</title>
  <!--
    Kahoot QR ile başka cihazlardan katılım için public adres.
    Site Vercel'de bu adreste yayında:
    https://ravza-yusuf63.vercel.app/
    QR kod her zaman bu adrese yönlendirir.
  -->
  <meta name="kahoot-public-url" content="https://ravza-yusuf63.vercel.app/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    Arayüz metni artık cihazın kendi sistem fontunu kullanıyor (iOS'ta SF Pro,
    Windows'ta Segoe UI) - bkz. css/base/ios-tokens.css --font-ui. SF dosyaları
    lisans gereği projeye gömülmez, sistem yığını üzerinden gelir.
    Google Fonts'tan yalnızca marka imzası olan Playfair Display çekilir;
    Plus Jakarta Sans kaldırıldı (daha az istek, daha hızlı ilk boyama).
  -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <!--
    Tek paket: css/style.css 50 dosyalik @import manifestidir ve kaynak
    dogrulugu odur; gelistirme yine ayri dosyalarda yapilir. Servis edilen
    surum `npm run build:css` ile uretilir (bkz. scripts/build-css.mjs).
  -->
  <link rel="stylesheet" href="./css/style.min.css?v=liquid-optics-20260715-1">
  <script type="module" src="./js/ana-sayfa-hero-bootstrap.js?v=home-hero-responsive-20260711-1"></script>
</head>
<body>
  <div id="app">
    <div id="topbar-root"></div>
    <div id="tema-panel-root"></div>
    <div id="launcher-shell-root"></div>

    <main class="main-content">

          <div class="startup-fallback__content">

              <div class="startup-fallback__ring-track"></div>
              <span class="startup-fallback__logo">Y<span class="startup-fallback__heart">♥</span>R</span>
            </div>
            <p class="startup-fallback__title">İçerik yükleniyor…</p>
            <p class="startup-fallback__subtitle">Lütfen bekleyin</p>
            <div class="startup-fallback__dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
        </section>
      </div>
    </main>

    <button id="scrollTopBtn" class="scroll-top-btn" aria-label="Yukarı çık">↑</button>
  </div>

  <!--

  <script type="module" src="./js/main.js?v=liquid-optics-20260715-1"></script>
