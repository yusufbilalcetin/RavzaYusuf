<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8fb">
  <meta name="color-scheme" content="light">
  <title>Ravza'nın Alan Bulmacası</title>
  <meta name="description" content="Sayıları doğru dikdörtgenlerle buluştur ve bütün alanı tamamla.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/game.css?v=1">
</head>
<body>
  <main class="game-app" id="gameApp">
    <header class="game-header">
      <a class="icon-button back-button" href="../../index.html?page=oyun" aria-label="Oyun alanına geri dön">
        <span aria-hidden="true">←</span>
      </a>

      <div class="title-block">
        <p>Ravza'ya özel</p>
        <h1>Ravza'nın Alan Bulmacası</h1>
        <span>Sayıları doğru dikdörtgenlerle buluştur, bütün alanı tamamla!</span>
      </div>

      <div class="header-actions">
        <button class="icon-button" id="soundButton" type="button" aria-label="Sesi kapat" title="Ses">
          <span id="soundIcon" aria-hidden="true">♪</span>
        </button>
        <button class="icon-button" id="helpButton" type="button" aria-label="Nasıl oynanır yardımını aç" title="Yardım">
          <span aria-hidden="true">?</span>
        </button>
      </div>
    </header>

    <section class="game-shell" aria-label="Alan bulmacası">
      <div class="level-row">
        <button class="level-button" id="levelButton" type="button" aria-label="Bölüm seçiciyi aç">
          <span id="levelLabel">Bölüm 1</span>
          <small id="difficultyLabel">Başlangıç</small>
          <span aria-hidden="true">⌄</span>
        </button>
        <div class="progress-copy" aria-live="polite">
          <strong id="progressText">0 / 36 hücre</strong>
          <span id="hintText">3 ipucu kaldı</span>
        </div>
      </div>

      <div class="progress-track" aria-hidden="true"><span id="progressFill"></span></div>

      <div class="stats" aria-label="Oyun bilgileri">
        <div class="stat"><span>Süre</span><strong id="timeValue">00:00</strong></div>
        <div class="stat"><span>Hamle</span><strong id="moveValue">0</strong></div>
        <div class="stat"><span>Yıldız</span><strong id="starValue" aria-label="3 yıldız mümkün">★★★</strong></div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Alan bulmacası tahtası">
          <div class="region-layer" id="regionLayer" aria-hidden="true"></div>
          <div class="board-grid" id="boardGrid"></div>
          <div class="selection-preview" id="selectionPreview" aria-hidden="true"></div>
          <div class="hint-preview" id="hintPreview" aria-hidden="true"><i></i><i></i></div>
        </div>
        <p class="board-status" id="boardStatus" role="status" aria-live="polite">Bir hücreden başlayıp dikdörtgen çiz.</p>
      </div>

      <button class="delete-button" id="deleteButton" type="button" aria-label="Seçili dikdörtgen alanı sil" disabled>Seçili alanı sil</button>

      <div class="controls" aria-label="Oyun kontrolleri">
        <button class="control-button" id="undoButton" type="button" aria-label="Son işlemi geri al" disabled>
          <span aria-hidden="true">↶</span><strong>Geri Al</strong>
        </button>
        <button class="control-button" id="hintButton" type="button" aria-label="İpucu kullan">
          <span aria-hidden="true">✦</span><strong>İpucu</strong><small id="hintCount">3</small>
        </button>
        <button class="control-button" id="resetButton" type="button" aria-label="Bölümü sıfırla">
          <span aria-hidden="true">↻</span><strong>Sıfırla</strong>
        </button>
        <button class="control-button control-button--primary" id="nextButton" type="button" aria-label="Sonraki bölüme geç" disabled>
          <span aria-hidden="true">→</span><strong>Sonraki</strong>
        </button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script type="module" src="./js/app.js?v=1"></script>
</body>
</html>
