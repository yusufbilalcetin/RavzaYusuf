<section id="games" class="page school-page games-page">
  <div class="school-hero games-hero">
    <span class="unit-badge">OYUN</span>
    <h2>Oyun Alanı</h2>
    <p>Kutu kutu oyun seç, tıklayınca oyun alanı açılsın.</p>
  </div>

  <div class="game-tile-grid" aria-label="Oyun listesi">
    <button class="game-tile is-live" type="button" data-game="candy-match">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/game-icon-candy-crush.jpeg" alt="" loading="lazy" />
      </span>
      <span class="game-tile-copy">
        <strong>Candy Crush</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="fruit-match">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/game-logo-meyve-eslestirme.png" alt="" loading="lazy" />
      </span>
      <span class="game-tile-copy">
        <strong>Meyve Eşleştirme</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="flappy-bird">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/game-icon-flappy-bird.webp" alt="" loading="lazy" />
      </span>
      <span class="game-tile-copy">
        <strong>Flappy Bird</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="boyama">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/game-icon-boyama.jpeg" alt="" loading="lazy" />
      </span>
      <span class="game-tile-copy">
        <strong>Boyama</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="renk-siralama">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/game-icon-renk-siralama.jpeg" alt="" loading="lazy" />
      </span>
      <span class="game-tile-copy">
        <strong>Renk Sıralama</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="sudoku">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <defs>
            <linearGradient id="sudokuIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f4f7ff" />
              <stop offset="55%" stop-color="#dbe4ff" />
              <stop offset="100%" stop-color="#aebfff" />
            </linearGradient>
            <radialGradient id="sudokuIconGloss" cx="32%" cy="20%" r="65%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity=".65" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
          </defs>
          <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#sudokuIconBg)" />
          <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#sudokuIconGloss)" />
          <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" />
          <rect x="20" y="20" width="60" height="60" rx="6" fill="#ffffff" stroke="#2b3a8f" stroke-width="3" />
          <line x1="40" y1="20" x2="40" y2="80" stroke="#8f9cd9" stroke-width="1.5" />
          <line x1="60" y1="20" x2="60" y2="80" stroke="#8f9cd9" stroke-width="1.5" />
          <line x1="20" y1="40" x2="80" y2="40" stroke="#8f9cd9" stroke-width="1.5" />
          <line x1="20" y1="60" x2="80" y2="60" stroke="#8f9cd9" stroke-width="1.5" />
          <text x="30" y="36" font-size="15" font-weight="700" fill="#2b3a8f" text-anchor="middle" font-family="Arial, sans-serif">5</text>
          <text x="70" y="36" font-size="15" font-weight="700" fill="#e0483f" text-anchor="middle" font-family="Arial, sans-serif">3</text>
          <text x="50" y="56" font-size="15" font-weight="700" fill="#2b3a8f" text-anchor="middle" font-family="Arial, sans-serif">7</text>
          <text x="30" y="76" font-size="15" font-weight="700" fill="#e0483f" text-anchor="middle" font-family="Arial, sans-serif">9</text>
          <text x="70" y="76" font-size="15" font-weight="700" fill="#2b3a8f" text-anchor="middle" font-family="Arial, sans-serif">1</text>
        </svg>
      </span>
      <span class="game-tile-copy">
        <strong>Sudoku</strong>
      </span>
    </button>

    <a class="game-tile is-live" href="./games/alan-bulmacasi/index.html" aria-label="Ravza'nın Alan Bulmacası oyununu aç">
      <span class="game-tile-art game-tile-art--icon area-puzzle-icon" aria-hidden="true">
        <span class="area-puzzle-preview">
          <i class="area-preview-region area-preview-region--four"><b>4</b></i>
          <i class="area-preview-region area-preview-region--eight"><b>8</b></i>
          <i class="area-preview-region area-preview-region--six"><b>6</b></i>
          <i class="area-preview-region area-preview-region--pink"><b>4</b></i>
        </span>
      </span>
      <span class="game-tile-copy">
        <strong>Alan Bulmacası</strong>
      </span>
    </a>
  </div>

  <div class="game-stage" id="gameStage" hidden>
    <div class="game-stage-head">
      <div>
        <span class="unit-badge" id="gameStageBadge">OYUN</span>
        <h3 id="gameStageTitle">Oyun</h3>
        <p id="gameStageSubtitle">Oyunu başlat.</p>
      </div>
      <button class="game-close-btn" type="button" id="gameCloseBtn" aria-label="Oyunu kapat">
        <span aria-hidden="true"></span>
      </button>
    </div>
    <div class="game-stage-body" id="gameStageBody"></div>
  </div>
</section>
