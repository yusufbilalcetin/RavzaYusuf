<section id="games" class="page school-page games-page">
  <div class="school-hero games-hero">
    <span class="unit-badge">OYUN</span>
    <h2>Oyun Alanı</h2>
    <p>Kutu kutu oyun seç, tıklayınca oyun alanı açılsın.</p>
  </div>

  <div class="game-tile-grid" data-game-catalog aria-label="Oyun listesi"></div>

  <!-- data-reveal-skip sart: bu tam ekran katman position:fixed. Scroll-reveal
       gozlemcisi ozel bir root (uygulama kaydirma elemani) kullaniyor ve fixed
       eleman onunla hic kesismiyor, yani .is-revealed hicbir zaman eklenmiyor.
       Emniyet zamanlayicisi da ilk hedef acilir acilmaz iptal edildigi icin
       sahne kalici olarak opacity:0'da kaliyordu - oyun gorunmuyordu. -->
  <div class="game-stage" id="gameStage" hidden data-reveal-skip>
    <div class="game-stage-head">
      <div>
        <span class="unit-badge" id="gameStageBadge">OYUN</span>
        <h3 id="gameStageTitle">Oyun</h3>
        <p id="gameStageSubtitle">Oyunu başlat.</p>
      </div>
      <button class="game-close-btn" type="button" id="gameCloseBtn" aria-label="Oyunu kapat">
        <span aria-hidden="true"></span>
      </button>
    </div>
    <div class="game-stage-body" id="gameStageBody"></div>
  </div>
</section>
