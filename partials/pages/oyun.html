<section id="games" class="page school-page games-page">
  <div class="school-hero games-hero">
    <span class="unit-badge">OYUN</span>
    <h2>Oyun Alanı</h2>
    <p>Kutu kutu oyun seç, tıklayınca oyun alanı açılsın.</p>
  </div>

  <div class="game-tile-grid" aria-label="Oyun listesi">
    <button class="game-tile is-live" type="button" data-game="candy-match">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/icons/games/candy-crush.png" alt="" width="1024" height="1024" loading="lazy" decoding="async" />
      </span>
      <span class="game-tile-copy">
        <strong>Candy Crush</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="fruit-match">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/icons/games/meyve-eslestirme.png" alt="" width="1024" height="1024" loading="lazy" decoding="async" />
      </span>
      <span class="game-tile-copy">
        <strong>Meyve Eşleştirme</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="flappy-bird">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/icons/games/flappy-bird.png" alt="" width="1024" height="1024" loading="lazy" decoding="async" />
      </span>
      <span class="game-tile-copy">
        <strong>Flappy Bird</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="boyama">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/icons/games/boyama.png" alt="" width="1024" height="1024" loading="lazy" decoding="async" />
      </span>
      <span class="game-tile-copy">
        <strong>Boyama</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="renk-siralama">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/icons/games/renk-siralama.png" alt="" width="1024" height="1024" loading="lazy" decoding="async" />
      </span>
      <span class="game-tile-copy">
        <strong>Renk Sıralama</strong>
      </span>
    </button>

    <button class="game-tile is-live" type="button" data-game="sudoku">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/icons/games/sudoku.png" alt="" width="1024" height="1024" loading="lazy" decoding="async" />
      </span>
      <span class="game-tile-copy">
        <strong>Sudoku</strong>
      </span>
    </button>

    <a class="game-tile is-live" href="./games/cark-oyunu/index.html" aria-label="Şans Çarkı oyununu aç">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/icons/games/sans-carki.png" alt="" width="1024" height="1024" loading="lazy" decoding="async" />
      </span>
      <span class="game-tile-copy">
        <strong>Şans Çarkı</strong>
      </span>
    </a>

    <a class="game-tile is-live" href="./games/alan-bulmacasi/index.html" aria-label="Ravza'nın Alan Bulmacası oyununu aç">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/icons/games/alan-bulmacasi.png" alt="" width="1024" height="1024" loading="lazy" decoding="async" />
      </span>
      <span class="game-tile-copy">
        <strong>Alan Bulmacası</strong>
      </span>
    </a>

    <a class="game-tile is-live" href="./games/ok-bulmacasi/index.html" aria-label="Ravza'nın Ok Bulmacası oyununu aç">
      <span class="game-tile-art game-tile-art--icon" aria-hidden="true">
        <img class="game-tile-img" src="./assets/icons/games/ok-bulmacasi.png" alt="" width="1024" height="1024" loading="lazy" decoding="async" />
      </span>
      <span class="game-tile-copy">
        <strong>Ok Bulmacası</strong>
      </span>
    </a>
  </div>

  <div class="game-stage" id="gameStage" hidden>
    <div class="game-stage-head">
      <div>
        <span class="unit-badge" id="gameStageBadge">OYUN</span>
        <h3 id="gameStageTitle">Oyun</h3>
        <p id="gameStageSubtitle">Oyunu başlat.</p>
      </div>
      <button class="game-close-btn" type="button" id="gameCloseBtn" aria-label="Oyunu kapat">
        <span aria-hidden="true"></span>
      </button>
    </div>
    <div class="game-stage-body" id="gameStageBody"></div>
  </div>
</section>
