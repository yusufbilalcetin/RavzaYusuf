<button class="theme-sheet-backdrop" id="theme-sheet-backdrop" type="button" data-theme-sheet-close aria-label="Tema panelini kapat"></button>
    <aside class="theme-sheet glass-surface glass-surface--overlay" id="theme-sheet" role="dialog" aria-modal="true" aria-labelledby="themeSheetTitle" aria-hidden="true" tabindex="-1">
      <div class="theme-sheet-head">
        <div>
          <span class="unit-badge quiz-badge">TEMA</span>
          <h3 id="themeSheetTitle">Tema Seç</h3>
          <p>Çalışma alanını tek dokunuşla değiştir.</p>
        </div>
        <button type="button" class="theme-sheet-close" data-theme-sheet-close aria-label="Kapat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>

      <section class="theme-mode-section" aria-labelledby="themeModeTitle">
        <div><strong id="themeModeTitle">Görünüm</strong><small>Sistem seçimi cihaz ayarını otomatik izler.</small></div>
        <div class="theme-mode-control" role="group" aria-label="Açık, koyu veya sistem görünümü">
          <button type="button" data-theme-mode="system" aria-pressed="false">Sistem</button>
          <button type="button" data-theme-mode="light" aria-pressed="false">Açık</button>
          <button type="button" data-theme-mode="dark" aria-pressed="false">Koyu</button>
        </div>
      </section>

      <div class="theme-sheet-grid" role="listbox" aria-label="Renk stili">
        <button type="button" class="theme-choice-card" data-theme-id="noel-ask" role="option" aria-selected="false">
          <span class="theme-choice-preview preview-noel-ask"></span>
          <span class="theme-choice-meta">
            <strong>Noel Aşk Teması</strong>
            <small>Sevgi dolu, sıcak ve romantik yeni yıl görünümü.</small>
          </span>
          <span class="theme-choice-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
        </button>

        <button type="button" class="theme-choice-card" data-theme-id="gece-mavisi" role="option" aria-selected="false">
          <span class="theme-choice-preview preview-gece-mavisi"></span>
          <span class="theme-choice-meta">
            <strong>Gece Mavisi</strong>
            <small>Odak artıran serin mavi ve sakin gece tonları.</small>
          </span>
          <span class="theme-choice-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
        </button>

        <button type="button" class="theme-choice-card" data-theme-id="orman-yesili" role="option" aria-selected="false">
          <span class="theme-choice-preview preview-orman-yesili"></span>
          <span class="theme-choice-meta">
            <strong>Orman Yeşili</strong>
            <small>Doğadan ilham alan huzurlu ve derin tonlar.</small>
          </span>
          <span class="theme-choice-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
        </button>

        <button type="button" class="theme-choice-card" data-theme-id="mor-isik" role="option" aria-selected="false">
          <span class="theme-choice-preview preview-mor-isik"></span>
          <span class="theme-choice-meta">
            <strong>Mor Işık</strong>
            <small>Modern, enerjik ve parlak mor vurgu teması.</small>
          </span>
          <span class="theme-choice-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
        </button>

        <button type="button" class="theme-choice-card" data-theme-id="klasik-koyu" role="option" aria-selected="false">
          <span class="theme-choice-preview preview-klasik-koyu"></span>
          <span class="theme-choice-meta">
            <strong>Klasik Koyu</strong>
            <small>Zamansız, sade ve minimal koyu görünüm.</small>
          </span>
          <span class="theme-choice-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
        </button>

        <button type="button" class="theme-choice-card" data-theme-id="pembe-tema" role="option" aria-selected="false">
          <span class="theme-choice-preview preview-pembe-tema"></span>
          <span class="theme-choice-meta">
            <strong>Pembe Tema</strong>
            <small>Yumuşak pembe tonları, net kontrast ve sade romantik görünüm.</small>
          </span>
          <span class="theme-choice-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span>
        </button>
      </div>
    </aside>
